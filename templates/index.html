<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>AI Based Proactive and Traffic Prediction System</title>
    <meta name="description" content="AI-based proactive traffic prediction system for Bengaluru using ML models to visualize per-segment congestion and find optimal routes on an interactive map.">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- ═══════════════════════════════════════════════════════════
         FLOATING CONTROL PANEL
         ═══════════════════════════════════════════════════════════ -->
    <div class="control-card" id="control-card">

        <!-- Header -->
        <header class="control-header">
            <div class="header-text">
                <div class="logo-row">
                    <div class="logo-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="3 11 22 2 13 21 11 13 3 11"/>
                        </svg>
                    </div>
                    <h1>AI Traffic Predictor</h1>
                </div>
                <p class="subtitle">AI Based Proactive and Traffic Prediction System</p>
            </div>
            <button id="toggle-panel" class="toggle-btn" title="Toggle Panel">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
            </button>
        </header>

        <div class="control-body" id="control-body">

            <!-- Mode Toggle -->
            <div class="mode-toggle">
                <button class="mode-btn active" id="mode-live" data-mode="live">
                    <span class="mode-dot live-dot"></span>
                    Depart Now
                </button>
                <button class="mode-btn" id="mode-predictive" data-mode="predictive">
                    <span class="mode-dot predictive-dot"></span>
                    Plan Future
                </button>
            </div>

            <!-- Datetime Picker (hidden by default) -->
            <div class="datetime-group hidden" id="datetime-group">
                <label for="departure-time">Departure Time</label>
                <input type="datetime-local" id="departure-time" class="input-field">
            </div>

            <!-- Source -->
            <div class="form-group">
                <label for="source">
                    <span class="label-icon origin-icon"></span>
                    Origin
                </label>
                <select id="source" class="input-field" required>
                    <option value="" disabled selected>Select origin…</option>
                </select>
            </div>

            <!-- Destination -->
            <div class="form-group">
                <label for="destination">
                    <span class="label-icon dest-icon"></span>
                    Destination
                </label>
                <select id="destination" class="input-field" required>
                    <option value="" disabled selected>Select destination…</option>
                </select>
            </div>

            <!-- Route Button -->
            <button type="button" class="btn-route" id="btn-route">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                Find Optimal Route
            </button>

            <!-- Error Display -->
            <div class="error-msg hidden" id="error-msg"></div>

            <!-- Results Dashboard -->
            <div class="results-dashboard hidden" id="results-dashboard">

                <!-- Metrics Grid -->
                <div class="metrics-grid">
                    <div class="metric-card" id="metric-card-time">
                        <span class="metric-icon">🕐</span>
                        <span class="metric-value" id="metric-time">—</span>
                        <span class="metric-label">Travel Time</span>
                    </div>
                    <div class="metric-card" id="metric-card-distance">
                        <span class="metric-icon">📍</span>
                        <span class="metric-value" id="metric-distance">—</span>
                        <span class="metric-label">Distance</span>
                    </div>
                </div>

                <!-- Route Path -->
                <div class="route-path" id="route-path"></div>

                <!-- Congestion Legend -->
                <div class="congestion-legend">
                    <div class="legend-item">
                        <span class="legend-dot free-flow"></span>
                        Clear (&gt;25 km/h)
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot moderate"></span>
                        Moderate (15–25)
                    </div>
                    <div class="legend-item">
                        <span class="legend-dot heavy"></span>
                        Heavy (&lt;15 km/h)
                    </div>
                </div>

                <!-- Data Source Badge -->
                <div class="source-badge" id="source-badge"></div>

                <!-- Navigation Controls (Fleet Routing) -->
                <div class="nav-controls" id="nav-controls">
                    <div class="nav-buttons-row">
                        <button type="button" class="btn-nav btn-start-nav" id="btn-start-nav">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                            Start Navigation
                        </button>
                        <button type="button" class="btn-nav btn-wrong-turn hidden" id="btn-wrong-turn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                                <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                            </svg>
                            Simulate Wrong Turn
                        </button>
                    </div>
                    <div class="telemetry-status hidden" id="telemetry-status">
                        <span class="telemetry-dot" id="telemetry-dot"></span>
                        <span class="telemetry-text" id="telemetry-text">Telemetry idle</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
         MAP CONTAINER
         ═══════════════════════════════════════════════════════════ -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
                .then(reg => console.log('[SW] Registered:', reg.scope))
                .catch(err => console.warn('[SW] Registration failed:', err));
        }
    </script>

    <!-- App JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
